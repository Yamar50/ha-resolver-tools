inspect:
  name: Inspect resolver configuration
  description: Administrator-only read of the resolver file, permissions, mount, backup, running HA DNS servers and last runtime refresh. No DNS changes.
check:
  name: Check DNS resolution
  description: Administrator-only DNS checks for api.switch-bot.com and www.home-assistant.io using configured servers, the system resolver and HA's running shared resolver. No HTTP requests.
apply:
  name: Apply DNS servers
  description: Administrator only. Validate, back up, apply and check DNS, then reload HA's running shared resolver. File verification failure rolls back previous bytes; a separate runtime refresh failure reports an error while retaining the successfully applied file.
  fields:
    servers:
      name: DNS server IP addresses
      description: One to three literal IP addresses. Omit to use the candidate text entity.
      example: ["192.0.2.53"]
      selector:
        object:
    expected_sha256:
      name: Current file SHA-256
      description: Obtain content_sha256 from inspect immediately before applying.
      required: true
      selector:
        text:
restore:
  name: Restore original DNS configuration
  description: Administrator only. Disable startup and periodic reapplication, restore the exact original bytes, then refresh HA's running shared resolver. Never runs automatically.
  fields:
    expected_sha256:
      name: Current file SHA-256
      required: true
      selector:
        text:
configure_startup:
  name: Configure startup DNS reapplication
  description: Administrator only. Enable or disable checking the last successfully applied DNS at integration startup. Requires a successful apply with version 0.3.0 or later. Does not immediately change DNS.
  fields:
    enabled:
      name: Reapply saved DNS at startup
      required: true
      selector:
        boolean:
refresh_runtime:
  name: Refresh running HA DNS
  description: Administrator only. Reload the current resolver file into HA's existing shared DNS resolver, verify server addresses and clear its connector DNS caches. Does not write the file, change the saved target or close connections. Reports unsupported runtimes and mismatches.
configure_watchdog:
  name: Configure periodic DNS repair
  description: Enable or disable the five-minute comparison and repair of saved, file and runtime DNS. Requires a successful apply. Enabling also checks immediately; candidates are never replayed.
  fields:
    enabled:
      name: Monitor and repair DNS every 5 minutes
      required: true
      selector:
        boolean:
monitor_now:
  name: Check DNS monitor now
  description: Compare current file and runtime against the saved target and repair only if periodic repair is enabled. One attempt; failed attempts wait for the next five-minute tick. Returns monitor status.
inspect_hosts:
  name: Inspect localhost hosts configuration
  description: Administrator-only inspection of /etc/hosts, localhost mappings, file hash, mount, original backup and repair policy. No lookup or file changes.
check_localhost:
  name: Check localhost resolution
  description: Administrator-only system and HA shared-resolver lookups. Requires correct localhost hosts mappings first. Reports exact loopback addresses; not part of the periodic monitor.
repair_localhost:
  name: Repair localhost in hosts
  description: Back up /etc/hosts once and ensure localhost maps only to 127.0.0.1 and ::1. Preserve other aliases and comments. Does not enable periodic repair or change DNS servers.
  fields:
    expected_sha256:
      name: Current hosts SHA-256
      description: Obtain content_sha256 from inspect_hosts immediately before applying.
      required: true
      selector:
        text:
restore_hosts:
  name: Restore original hosts file
  description: Disable localhost automatic repair and restore the exact original hosts bytes, even if the original file was empty. DNS policies are unchanged.
  fields:
    expected_sha256:
      name: Current hosts SHA-256
      required: true
      selector:
        text:
configure_hosts_watchdog:
  name: Configure localhost automatic repair
  description: Back up the original hosts before first enable, repair immediately and check at startup and every five minutes. Failures retry on later checks; uncertain writes need manual inspection. Independent of DNS repair.
  fields:
    enabled:
      name: Repair localhost at startup and every 5 minutes
      required: true
      selector:
        boolean:
